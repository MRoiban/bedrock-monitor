name: Bedrock outside probe
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: bedrock-public-journal
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      issues: write
      actions: read # Read the original run creation time, stable across reruns.
    outputs:
      page_ready: ${{ steps.ready.outputs.ready }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PROBE_BRANCH: ${{ github.event.repository.default_branch }}
      PROBE_COMMIT: '1'
    steps:
      - name: Check out the journal branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Install Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2
        with:
          bun-version: '1.4.3'
      - name: Observe and durably commit before delivery
        id: observation
        working-directory: prober
        env:
          BEDROCK_CANARY_URL: ${{ vars.BEDROCK_CANARY_URL }}
        run: bun run cli.ts probe
      - name: Deliver pending transitions
        id: delivery
        if: ${{ !cancelled() && steps.observation.outcome == 'success' }}
        continue-on-error: true
        working-directory: prober
        env:
          NTFY_TOPIC_URL: ${{ secrets.NTFY_TOPIC_URL }}
        run: bun run cli.ts notify
      - name: Build from journal without contacting home
        if: ${{ !cancelled() && steps.observation.outcome == 'success' }}
        working-directory: prober
        run: bun run cli.ts build
      - name: Upload the public page only
        uses: actions/upload-pages-artifact@cd15c77fe804eaf929a9cf9637433ef71eb5df62 # v3.0.1
        with:
          path: public/dist
      - name: Mark page ready
        id: ready
        run: echo 'ready=true' >> "$GITHUB_OUTPUT"
      - name: Surface a delivery checkpoint failure
        if: ${{ !cancelled() && steps.delivery.outcome == 'failure' }}
        run: exit 1
  deploy:
    needs: probe
    if: ${{ !cancelled() && needs.probe.outputs.page_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy independent public status
        id: deployment
        uses: actions/deploy-pages@d6db90192abf3ce181d8a74ede08c51d3d6a0602 # v4
